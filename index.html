<!DOCTYPE html>
<html>
<head>
  <base id="app-base" href="/">
  <script>
    if (window.location.pathname.indexOf('/fases-fezes') === 0) {
      document.getElementById('app-base').setAttribute('href', '/fases-fezes/');
    }
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Fases e Fezes - Cronoanálise e Gestão da Limpeza de Baias - Agropecuária Vertente">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fases e Fezes">
  <link rel="apple-touch-icon" href="icons/app-logo-192.png?v=30">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=30"/>

  <title>Fases e Fezes - Vertente</title>
  <link rel="manifest" href="manifest.json?v=30">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #183332;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    #flutter_splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #244847 0%, #183332 100%);
      z-index: 999999;
      color: white;
      text-align: center;
      transition: opacity 0.35s ease-out;
    }
    .splash-logo {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      animation: pulse 2s infinite ease-in-out;
    }
    .splash-title {
      margin-top: 16px;
      margin-bottom: 2px;
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #FFFFFF;
    }
    .splash-subtitle {
      margin: 0 0 20px 0;
      font-size: 13px;
      color: #94A3B8;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    .splash-loader-bar {
      width: 150px;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .splash-loader-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 45%;
      background-color: #38BDF8;
      border-radius: 4px;
      animation: shimmer 1.2s infinite ease-in-out;
    }
    .splash-status {
      margin-top: 12px;
      font-size: 11px;
      color: #CBD5E1;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <!-- Tela de Abertura / Splash Screen Instantânea -->
  <div id="flutter_splash">
    <img src="icons/app-logo-192.png?v=30" alt="Logo" class="splash-logo" />
    <div class="splash-title">Fases e Fezes</div>
    <div class="splash-subtitle">Agropecuária Vertente</div>
    <div class="splash-loader-bar"></div>
    <div class="splash-status">Iniciando sistema de campo...</div>
  </div>

  <script>
    // Alguma máquina tem tempo ou viagem ainda não salvos (sessão gravada pelo app em SessaoColetaService)
    function temSessaoAtiva() {
      try {
        const raw = localStorage.getItem('sessao_coleta_ativa_v1');
        if (!raw) return false;
        return (JSON.parse(raw).maquinas || []).some(function(m) {
          return m.inicioTrecho
            || Object.keys(m.msAcumulado || {}).length > 0
            || (m.viagensEmTransito || []).length > 0
            || (m.viagensConcluidas || []).length > 0;
        });
      } catch (_) { return false; }
    }

    // Manda ao Service Worker tudo o que esta página carregou (motor gráfico, fontes, Firebase)
    // para que o app abra sem internet na próxima vez
    function guardarRecursosOffline() {
      if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return;
      try {
        const urls = performance.getEntriesByType('resource').map(function(e) { return e.name; });
        navigator.serviceWorker.controller.postMessage({ type: 'GUARDAR_RECURSOS', urls: urls });
      } catch (_) {}
    }

    // Pede ao navegador para não apagar os dados do app (medições não sincronizadas)
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persisted().then(function(ja) {
        if (!ja) navigator.storage.persist().catch(function() {});
      }).catch(function() {});
    }

    // Remove o splash assim que o primeiro frame do Flutter é desenhado
    window.addEventListener('flutter-first-frame', function () {
      const splash = document.getElementById('flutter_splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 350);
      }
      // Espera o Firebase e as fontes terminarem de carregar
      setTimeout(guardarRecursosOffline, 4000);
    });

    // Fallback: se o evento demorar mais de 6s, remove o splash para segurança
    setTimeout(function() {
      const splash = document.getElementById('flutter_splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() { splash.remove(); }, 350);
      }
    }, 6000);

    // Função global chamada pelo Flutter para forçar atualização total e purgar caches
    // Endereço do app relativo à pasta onde ele está (raiz no Firebase, /fases-fezes/ no GitHub)
    function urlRecarregar() {
      return new URL('./?v=2.1&t=' + Date.now(), document.baseURI).href;
    }

    window.forcarAtualizacaoPwa = function() {
      // Apagar o cache sem internet deixaria o app sem abrir
      if (!navigator.onLine) {
        alert('Sem internet: a atualização será feita quando o sinal voltar.');
        return;
      }
      console.log('[PWA] Forçando atualização total e limpeza de cache...');
      if ('caches' in window) {
        caches.keys().then(function(names) {
          return Promise.all(names.map(function(name) { return caches.delete(name); }));
        }).then(function() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { return r.unregister(); }));
            }).then(function() {
              window.location.replace(urlRecarregar());
            });
          } else {
            window.location.replace(urlRecarregar());
          }
        });
      } else {
        window.location.replace(urlRecarregar());
      }
    };

    // Purgar de forma incondicional qualquer cache diferente da versão atual v30
    if ('caches' in window) {
      caches.keys().then(function(cacheNames) {
        cacheNames.forEach(function(c) {
          if (c !== 'fases-e-fezes-v30' && c !== 'fases-e-fezes-externos') {
            console.log('[PWA] Purgando cache antigo:', c);
            caches.delete(c);
          }
        });
      });
    }

    // Registro do Service Worker com recarregamento automático no controllerchange e message
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      let recarregarPendente = false;
      function autoReload() {
        if (refreshing) return;
        // Não recarrega no meio de uma medição: espera todas as máquinas serem salvas
        if (temSessaoAtiva()) {
          if (!recarregarPendente) console.log('[PWA] Atualização adiada: há medições em andamento.');
          recarregarPendente = true;
          return;
        }
        refreshing = true;
        console.log('[PWA] Atualização aplicada! Recarregando com a versão mais recente...');
        window.location.reload();
      }
      setInterval(function() {
        if (recarregarPendente) autoReload();
      }, 15000);

      navigator.serviceWorker.addEventListener('controllerchange', function() {
        // O novo Service Worker ainda não guardou o motor gráfico desta versão do navegador
        guardarRecursosOffline();
        autoReload();
      });

      navigator.serviceWorker.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'RELOAD_NOW') {
          autoReload();
        }
      });

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js?v=30').then(function(reg) {
          reg.update();
          console.log('[PWA] Service Worker v30 registrado:', reg.scope);

          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }

          reg.addEventListener('updatefound', function() {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', function() {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[PWA] Nova versão instalada. Forçando ativação...');
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            }
          });
        }).catch(function(err) {
          console.warn('[PWA] Falha ao registrar Service Worker:', err);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=30" async></script>
</body>
</html>
